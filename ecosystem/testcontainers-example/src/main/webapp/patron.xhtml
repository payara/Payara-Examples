<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/layout/template.xhtml">

    <ui:define name="content">
        <h3>Patron</h3>
        <p>Represents library patrons who borrow books.</p>
        <h:panelGrid columns="2" columnClasses="label,value" styleClass="table-form">

            <h:outputLabel for="name" value="Name:" />
            <h:inputText id="name" value="#{patronBean.patron.name}" />

            <h:outputLabel for="address" value="Address:" />
            <h:inputText id="address" value="#{patronBean.patron.address}" />

            <h:outputLabel for="email" value="Email:" />
            <h:inputText id="email" value="#{patronBean.patron.email}" />
        </h:panelGrid>
        <!-- Generated id: not user-editable (see Patron.assignId()), same
             pattern as loan.xhtml's loanID hidden field. -->
        <h:inputHidden id="patronID" value="#{patronBean.patron.patronID}" />

        <h:commandButton value="Save" action="#{patronBean.save}" styleClass="btn btn-primary mt-3" />

        <h3 class="mt-5">Patron List</h3>
        <h:dataTable value="#{patronBean.allPatrons}" var="patron" border="1" styleClass="table table-striped table-bordered">
            <h:column>
                <f:facet name="header">Patron ID</f:facet>
                #{patron.patronID}
            </h:column>
            <h:column>
                <f:facet name="header">Name</f:facet>
                #{patron.name}
            </h:column>
            <h:column>
                <f:facet name="header">Address</f:facet>
                #{patron.address}
            </h:column>
            <h:column>
                <f:facet name="header">Email</f:facet>
                #{patron.email}
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandLink value="Edit" action="#{patronBean.edit(patron)}" styleClass="btn btn-link p-0" />
                |
                <h:commandLink value="Delete" action="#{patronBean.remove(patron.patronID)}"
                               onclick="return confirm('Delete this patron?');" 
                               styleClass="btn btn-link p-0 text-danger" />
            </h:column>
        </h:dataTable>
    </ui:define>
</ui:composition>
